<html lang="en" vid="0"><head vid="1">
<meta charset="UTF-8" vid="2">
<meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
<title vid="4">Hardware Player Widget</title>
<style vid="5">
    :root {
        
        --chassis-base: #151515;
        --chassis-dark: #111111;
        --chassis-light: #1c1c1c;
        --seam-color: #050505;
        
        --text-primary: #d0d0d0;
        --text-secondary: #777777;
        --text-dim: #444444;
        
        --accent-blue-core: #b2e5ff;
        --accent-blue-glow: #3a8ebd;
        --accent-green-core: #80ff9d;
        --accent-green-glow: #25ad52;
        --accent-red-core: #ff4545;
        --accent-red-glow: #bd3434;
        
        --highlight-edge: rgba(255, 255, 255, 0.04);
        --shadow-deep: rgba(0, 0, 0, 0.8);
        --shadow-soft: rgba(0, 0, 0, 0.4);

        
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'SF Mono', 'Roboto Mono', 'JetBrains Mono', 'Courier New', monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
    }

    body {
        background-color: #0a0a0a; 
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: var(--font-sans);
    }

    
    .widget-device {
        width: 360px;
        height: 420px;
        background-color: var(--seam-color); 
        border-radius: 6px;
        padding: 2px; 
        
        
        display: grid;
        grid-template-columns: 50px 1fr 110px;
        grid-template-rows: 80px 1fr 110px;
        gap: 2px; 
        
        box-shadow: 
            0 40px 80px rgba(0,0,0,0.8), 
            0 10px 20px rgba(0,0,0,0.5),
            inset 0 0 0 1px #222, 
            inset 0 0 0 2px #000; 
            
        position: relative;
        overflow: visible;
    }

    
    .panel {
        background: linear-gradient(135deg, var(--chassis-light), var(--chassis-dark));
        position: relative;
        
        box-shadow: 
            inset 1px 1px 0px var(--highlight-edge),
            inset -1px -1px 2px rgba(0,0,0,0.5);
    }

    

    
    .panel-indicator {
        grid-area: 1 / 1 / 2 / 2;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .status-light {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent-blue-core);
        box-shadow: 
            0 0 12px 2px var(--accent-blue-glow),
            inset 0 2px 4px rgba(255,255,255,0.8),
            inset 0 -2px 4px rgba(0,0,0,0.2),
            0 0 0 2px var(--chassis-dark); 
    }

    .status-light.is-off {
        background: #242424;
        box-shadow:
            inset 0 2px 4px rgba(0,0,0,0.8),
            0 0 0 2px var(--chassis-dark);
    }

    
    .panel-screen {
        grid-area: 1 / 2 / 2 / 4;
        background: #101010; 
        box-shadow: inset 2px 2px 10px rgba(0,0,0,0.8);
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .screen-top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .track-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .track-title {
        font-family: var(--font-mono);
        color: var(--text-primary);
        font-size: 11px;
        letter-spacing: 0.5px;
        font-weight: 500;
    }

    .track-title.is-connect-prompt {
        color: var(--accent-green-core);
        text-shadow: 0 0 10px var(--accent-green-glow);
    }

    .track-artist {
        color: var(--text-secondary);
        font-size: 10px;
        letter-spacing: 0.2px;
    }

    .screen-meta {
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
    }

    .meta-time {
        color: var(--text-secondary);
        font-size: 9px;
        letter-spacing: 0.5px;
        font-family: var(--font-mono);
    }
    
    .meta-date {
        color: var(--text-dim);
        font-size: 9px;
        letter-spacing: 0.5px;
    }

    .screen-bottom-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .track-counter {
        color: var(--text-secondary);
        font-size: 10px;
        font-family: var(--font-mono);
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .track-counter::before {
        content: '';
        display: block;
        width: 6px;
        height: 2px;
        background: var(--text-dim);
    }

    
    .hollow-numbers {
        font-family: var(--font-mono);
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -1.5px;
        color: var(--text-secondary);
        line-height: 0.8;
    }

    .eq-wave {
        display: flex;
        gap: 2px;
        height: 16px;
        align-items: flex-end;
        margin-bottom: 2px;
    }

    .eq-bar {
        width: 2px;
        background-color: var(--text-secondary);
        border-radius: 1px;
        transform-origin: bottom;
        transition: opacity 160ms ease;
    }

    .eq-wave.is-playing .eq-bar {
        animation: eqPulse 720ms ease-in-out infinite alternate;
        background-color: var(--accent-blue-core);
        box-shadow: 0 0 4px rgba(58,142,189,0.45);
    }

    .eq-wave.is-playing .eq-bar:nth-child(2n) { animation-duration: 560ms; }
    .eq-wave.is-playing .eq-bar:nth-child(3n) { animation-duration: 820ms; }
    .eq-wave.is-playing .eq-bar:nth-child(4n) { animation-duration: 660ms; }
    .eq-wave.is-playing .eq-bar:nth-child(1) { animation-delay: -80ms; }
    .eq-wave.is-playing .eq-bar:nth-child(2) { animation-delay: -220ms; }
    .eq-wave.is-playing .eq-bar:nth-child(3) { animation-delay: -140ms; }
    .eq-wave.is-playing .eq-bar:nth-child(4) { animation-delay: -310ms; }
    .eq-wave.is-playing .eq-bar:nth-child(5) { animation-delay: -40ms; }
    .eq-wave.is-playing .eq-bar:nth-child(6) { animation-delay: -260ms; }
    .eq-wave.is-playing .eq-bar:nth-child(7) { animation-delay: -170ms; }
    .eq-wave.is-playing .eq-bar:nth-child(8) { animation-delay: -360ms; }
    .eq-wave.is-playing .eq-bar:nth-child(9) { animation-delay: -110ms; }
    .eq-wave.is-playing .eq-bar:nth-child(10) { animation-delay: -290ms; }
    .eq-wave.is-playing .eq-bar:nth-child(11) { animation-delay: -190ms; }

    @keyframes eqPulse {
        from {
            transform: scaleY(0.38);
            opacity: 0.58;
        }
        to {
            transform: scaleY(1.08);
            opacity: 1;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .eq-wave.is-playing .eq-bar {
            animation: none;
            transform: scaleY(1);
        }
    }

    
    .panel-arrows {
        grid-area: 2 / 1 / 3 / 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 24px;
    }

    .arrow-btn {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: transparent;
        border: none;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text-dim);
        font-size: 10px;
        
        box-shadow: 
            inset 1px 1px 3px rgba(0,0,0,0.5),
            inset -1px -1px 2px rgba(255,255,255,0.03);
        transition: color 0.2s, box-shadow 0.1s;
    }

    .arrow-btn:hover { color: var(--text-secondary); }
    .arrow-btn:active {
        box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
    }

    
    .panel-platter {
        grid-area: 2 / 2 / 3 / 4;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    
    .chassis-label {
        position: absolute;
        top: 12px;
        left: 12px;
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .platter-container {
        width: 190px;
        height: 190px;
        border-radius: 50%;
        
        background: #0f0f0f;
        box-shadow: 
            inset 0 4px 10px rgba(0,0,0,0.8),
            inset 0 -1px 2px rgba(255,255,255,0.05);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .platter-disc {
        width: 184px;
        height: 184px;
        border-radius: 50%;
        
        background: conic-gradient(
            from 0deg,
            #1a1a1a 0%, #222 15%, #151515 30%, #111 50%, #151515 70%, #222 85%, #1a1a1a 100%
        );
        box-shadow: 
            0 4px 10px rgba(0,0,0,0.6),
            inset 0 1px 1px rgba(255,255,255,0.08),
            inset 0 0 0 1px #2a2a2a;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.1s;
    }

    .platter-disc.is-playing {
        animation: platterSpin 3s linear infinite;
    }

    .earphone-cable {
        position: absolute;
        left: 50%;
        top: calc(100% - 1px);
        width: 180px;
        height: 132px;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 7;
    }

    .earphone-cable-svg {
        position: absolute;
        inset: 0;
        overflow: visible;
    }

    .platter-center-cap {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #111;
        box-shadow: 
            inset 1px 1px 4px rgba(0,0,0,0.8),
            0 1px 1px rgba(255,255,255,0.05);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .platter-spindle {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #222;
        box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
    }

    
    .panel-transport {
        grid-area: 3 / 1 / 4 / 3;
        display: flex;
        align-items: center;
        padding-left: 16px;
        gap: 16px;
        position: relative;
        
        background-image: radial-gradient(circle, #080808 1.5px, transparent 1.5px);
        background-size: 8px 8px;
        background-position: center right;
        background-color: var(--chassis-base); 
    }
    
    
    .panel-transport::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, var(--chassis-base) 40%, transparent 100%);
        pointer-events: none;
    }

    .transport-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--chassis-base);
        border: none;
        cursor: pointer;
        position: relative;
        z-index: 2;
        
        box-shadow: 
            inset 3px 3px 6px rgba(0,0,0,0.8),
            inset -1px -1px 3px rgba(255,255,255,0.04),
            0 1px 1px rgba(255,255,255,0.03);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.1s;
    }

    .transport-btn:active {
        box-shadow: 
            inset 4px 4px 8px rgba(0,0,0,0.9),
            inset -1px -1px 2px rgba(255,255,255,0.02);
    }

    .transport-btn:disabled,
    .arrow-btn:disabled {
        cursor: default;
        opacity: 0.42;
    }

    .transport-btn.is-login-lit .icon-rec {
        background: var(--accent-red-core);
        box-shadow:
            0 0 8px 1.6px var(--accent-red-glow),
            inset 1px 1px 2px rgba(255,255,255,0.35);
    }

    .transport-btn.is-control-lit,
    .arrow-btn.is-control-lit {
        color: var(--accent-blue-core);
        box-shadow:
            0 0 8px rgba(58,142,189,0.28),
            inset 3px 3px 6px rgba(0,0,0,0.8),
            inset -1px -1px 3px rgba(178,229,255,0.12);
        opacity: 1;
    }

    .arrow-btn.is-control-lit {
        text-shadow: 0 0 8px var(--accent-blue-glow);
    }

    .transport-btn.is-control-lit .icon-stop {
        background: var(--accent-blue-core);
        box-shadow: 0 0 6.4px var(--accent-blue-glow);
    }

    .transport-btn.is-control-lit .icon-play {
        border-left-color: var(--accent-blue-core);
        filter: drop-shadow(0 0 4px var(--accent-blue-glow));
    }

    .transport-btn.is-control-lit .icon-pause {
        border-left-color: var(--accent-blue-core);
        border-right-color: var(--accent-blue-core);
        filter: drop-shadow(0 0 4px var(--accent-blue-glow));
    }

    
    .icon-rec {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7a2222; 
        box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
    }

    .icon-play {
        width: 0; 
        height: 0; 
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-left: 8px solid var(--text-secondary);
        margin-left: 2px; 
    }

    .icon-stop {
        width: 8px;
        height: 8px;
        background: var(--text-secondary);
    }

    .icon-pause {
        width: 10px;
        height: 10px;
        border-left: 3px solid var(--text-secondary);
        border-right: 3px solid var(--text-secondary);
    }

    
    .panel-knob {
        grid-area: 3 / 3 / 4 / 4;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .knob-container {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        
        background: #111;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .knob-physical {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        
        background: linear-gradient(135deg, #2a2a2a, #111);
        box-shadow: 
            -2px -2px 5px rgba(255,255,255,0.03),
            4px 4px 10px rgba(0,0,0,0.8),
            inset 0 0 0 1px #333;
        position: relative;
        cursor: grab;
        touch-action: none;
        transform: rotate(var(--knob-rotation, 27deg));
        transition: transform 110ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 120ms ease;
        will-change: transform;
    }

    .knob-physical:active,
    .knob-physical.is-dragging {
        cursor: grabbing;
        transition: box-shadow 120ms ease;
        box-shadow:
            -1px -1px 4px rgba(255,255,255,0.04),
            3px 3px 8px rgba(0,0,0,0.85),
            inset 2px 2px 4px rgba(0,0,0,0.45),
            inset 0 0 0 1px #3a3a3a;
    }

    
    .knob-indicator {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 2px;
        height: 10px;
        background: #080808;
        border-radius: 1px;
        box-shadow: inset 1px 1px 1px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05);
    }

    .knob-indicator.is-control-lit {
        background: var(--accent-blue-core);
        box-shadow:
            0 0 10px 2px var(--accent-blue-glow),
            inset 0 1px 1px rgba(255,255,255,0.35);
    }

    @keyframes platterSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

</style>
</head>

<script>
    const WEB_HAPTICS_URL = 'https://esm.sh/web-haptics@0.0.6';
    const SPOTIFY_CLIENT_ID = 'ccc37f0ad9534259bfc68a390da5b9f6';
    const SPOTIFY_REDIRECT_URI = 'https://rekord-player.vercel.app/';
    const SHOW_EARPHONE_CABLE = false;
    const SPOTIFY_SCOPES = [
        'streaming',
        'user-read-email',
        'user-read-private',
        'user-read-playback-state',
        'user-read-currently-playing',
        'user-modify-playback-state'
    ].join(' ');

    const STORAGE = {
        accessToken: 'rekord.spotify.accessToken',
        refreshToken: 'rekord.spotify.refreshToken',
        expiresAt: 'rekord.spotify.expiresAt',
        verifier: 'rekord.spotify.codeVerifier',
        state: 'rekord.spotify.state'
    };

    const elements = {
        device: document.getElementById('widgetDevice'),
        statusLight: document.getElementById('statusLight'),
        trackTitle: document.getElementById('trackTitle'),
        trackArtist: document.getElementById('trackArtist'),
        trackTime: document.getElementById('trackTime'),
        metaDate: document.getElementById('metaDate'),
        trackCounter: document.getElementById('trackCounter'),
        previousButton: document.getElementById('previousButton'),
        nextButton: document.getElementById('nextButton'),
        loginButton: document.getElementById('loginButton'),
        playButton: document.getElementById('playButton'),
        playIcon: document.getElementById('playIcon'),
        stopButton: document.getElementById('stopButton'),
        eqWave: document.getElementById('eqWave'),
        platterDisc: document.getElementById('platterDisc'),
        earphoneCable: document.getElementById('earphoneCable'),
        earphoneCablePath: document.getElementById('earphoneCablePath'),
        earphoneCableShadow: document.getElementById('earphoneCableShadow'),
        earphoneCablePlug: document.getElementById('earphoneCablePlug'),
        volumeKnob: document.getElementById('volumeKnob'),
        volumeTick: document.getElementById('volumeTick')
    };

    let spotifyPlayer = null;
    let deviceId = null;
    let playerReady = false;
    let isPlaying = false;
    let currentVolume = 0.6;
    let targetVolume = currentVolume;
    let displayedVolume = currentVolume;
    let volumeAnimationFrame = null;
    let pendingSpotifyVolume = null;
    let volumeCommitTimer = null;
    let lastSpotifyVolumeCommit = 0;
    let pollingTimer = null;
    let haptics = null;
    let hapticsLoaded = false;
    let activeVolumePointer = null;
    let lastVolumeHapticStep = Math.round(currentVolume * 20);
    let motionEnabled = false;
    let cableTargetX = 0;
    let cableTipX = 0;
    let cableVelocityX = 0;
    let cableAnimationFrame = null;
    let motionPermissionStatus = 'idle';
    let motionPermissionRequest = null;
    let motionEventCount = 0;
    let genericAccelerometer = null;

    async function setupHaptics() {
        try {
            const { WebHaptics } = await import(WEB_HAPTICS_URL);
            haptics = new WebHaptics({ showSwitch: false });
            hapticsLoaded = true;
        } catch {
            hapticsLoaded = false;
        }
    }

    function normalizeNativeHapticPattern(input, options) {
        if (typeof input === 'number') return input;
        if (Array.isArray(input)) return input;

        const intensity = options?.intensity ?? 0.5;
        const scale = Math.max(0.45, Math.min(1, intensity));
        const patterns = {
            success: [30, 60, 40],
            nudge: [80, 80, 50],
            light: [15],
            medium: [25],
            heavy: [35],
            selection: [8],
            buzz: [1000]
        };
        return (patterns[input] || [Math.round(25 * scale)]).map((value) => Math.round(value * scale));
    }

    function nativeVibrate(input, options) {
        if (typeof navigator === 'undefined' || typeof navigator.vibrate !== 'function') return false;
        navigator.vibrate(normalizeNativeHapticPattern(input, options));
        return true;
    }

    function triggerHaptic(input = 'nudge', options) {
        if (hapticsLoaded && haptics) {
            haptics.trigger(input, options).catch(() => {});
            return;
        }

        nativeVibrate(input, options);
    }

    function setCableVisibility(visible) {
        elements.earphoneCable.hidden = !visible;
    }

    function setMotionStatus(status) {
        motionPermissionStatus = status;
        elements.earphoneCable.dataset.motionStatus = status;
        elements.earphoneCable.dataset.motionEvents = String(motionEventCount);
    }

    function removeMotionPermissionGestureHooks() {
        document.removeEventListener('click', enableMotionFromGesture);
        document.removeEventListener('touchend', enableMotionFromGesture);
        document.removeEventListener('pointerup', enableMotionFromGesture);
    }

    function enableMotionFromGesture() {
        requestMotionPermission({ fromGesture: true });
    }

    function installMotionPermissionGestureHooks() {
        if (!SHOW_EARPHONE_CABLE) return;
        document.addEventListener('click', enableMotionFromGesture, { once: true });
        document.addEventListener('touchend', enableMotionFromGesture, { once: true });
        document.addEventListener('pointerup', enableMotionFromGesture, { once: true });
    }

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function drawCablePath() {
        if (!SHOW_EARPHONE_CABLE) return;
        const startX = 90;
        const startY = 0;
        const bendY = 79;
        const tipX = 128 + cableTipX;
        const tipY = 108;
        const attachControlX = startX + cableTipX * 0.32;
        const upperControlX = startX + cableTipX * 0.58;
        const lowerControlX = startX + cableTipX * 0.72;
        const exitControlX = startX + 3 + cableTipX * 0.68;
        const path = [
            `M ${startX} ${startY}`,
            `C ${attachControlX} 28 ${upperControlX} 58 ${lowerControlX} ${bendY}`,
            `C ${lowerControlX} 101 ${exitControlX} 108 ${tipX} ${tipY}`
        ].join(' ');

        elements.earphoneCablePath.setAttribute('d', path);
        elements.earphoneCableShadow.setAttribute('d', path);
        const plugX = tipX;
        const plugY = tipY;
        const plugRotation = 180 + clamp(cableTipX * 0.28, -10, 10);
        elements.earphoneCablePlug.setAttribute('transform', `translate(${plugX} ${plugY}) rotate(${plugRotation})`);
    }

    function updateCablePhysics() {
        const force = (cableTargetX - cableTipX) * 0.075;
        cableVelocityX = (cableVelocityX + force) * 0.82;
        cableTipX += cableVelocityX;
        drawCablePath();

        if (Math.abs(cableTargetX - cableTipX) < 0.04 && Math.abs(cableVelocityX) < 0.04) {
            cableTipX = cableTargetX;
            cableVelocityX = 0;
            drawCablePath();
            cableAnimationFrame = null;
            return;
        }

        cableAnimationFrame = requestAnimationFrame(updateCablePhysics);
    }

    function setCableSway(nextSway) {
        if (!SHOW_EARPHONE_CABLE) return;
        cableTargetX = clamp(nextSway, -34, 34);
        if (!cableAnimationFrame) {
            cableAnimationFrame = requestAnimationFrame(updateCablePhysics);
        }
    }

    function markMotionEvent() {
        motionEventCount += 1;
        if (motionPermissionStatus !== 'receiving') {
            setMotionStatus('receiving');
        } else {
            elements.earphoneCable.dataset.motionEvents = String(motionEventCount);
        }
    }

    function handleDeviceOrientation(event) {
        if (typeof event.gamma !== 'number') return;
        markMotionEvent();
        setCableSway(event.gamma * 1.05);
    }

    function handleDeviceMotion(event) {
        const acceleration = event.accelerationIncludingGravity || event.acceleration;
        if (!acceleration || typeof acceleration.x !== 'number') return;
        markMotionEvent();
        setCableSway(acceleration.x * -4.2);
    }

    function startGenericSensorFallback() {
        if (genericAccelerometer || typeof Accelerometer === 'undefined') return;

        try {
            genericAccelerometer = new Accelerometer({ frequency: 30 });
            genericAccelerometer.addEventListener('reading', () => {
                markMotionEvent();
                setCableSway(genericAccelerometer.x * -4.2);
            });
            genericAccelerometer.addEventListener('error', () => {});
            genericAccelerometer.start();
        } catch {
            genericAccelerometer = null;
        }
    }

    function registerMotionListeners() {
        if (motionEnabled) return true;

        window.addEventListener('deviceorientation', handleDeviceOrientation, true);
        window.addEventListener('devicemotion', handleDeviceMotion, true);
        startGenericSensorFallback();
        motionEnabled = true;
        setMotionStatus('listening');
        return true;
    }

    function getSensorEventConstructor(name) {
        return typeof window !== 'undefined' ? window[name] : undefined;
    }

    async function requestSensorPermission(EventType) {
        if (typeof EventType === 'undefined') return 'unsupported';
        if (typeof EventType.requestPermission !== 'function') return 'granted';
        return EventType.requestPermission();
    }

    async function requestMotionPermission(options = {}) {
        if (!SHOW_EARPHONE_CABLE) return false;
        if (motionEnabled) return true;
        if (motionPermissionRequest) return motionPermissionRequest;

        const MotionEventType = getSensorEventConstructor('DeviceMotionEvent');
        const OrientationEventType = getSensorEventConstructor('DeviceOrientationEvent');
        const needsOrientationPermission =
            typeof OrientationEventType !== 'undefined' &&
            typeof OrientationEventType.requestPermission === 'function';
        const needsMotionPermission =
            typeof MotionEventType !== 'undefined' &&
            typeof MotionEventType.requestPermission === 'function';

        if ((needsOrientationPermission || needsMotionPermission) && !options.fromGesture) {
            setMotionStatus('needs-gesture');
            installMotionPermissionGestureHooks();
            return false;
        }

        motionPermissionRequest = (async () => {
            try {
                const motionPermissionPromise = requestSensorPermission(MotionEventType);
                const orientationPermissionPromise = requestSensorPermission(OrientationEventType);
                const [motionPermission, orientationPermission] = await Promise.all([
                    motionPermissionPromise,
                    orientationPermissionPromise
                ]);
                const motionUsable = motionPermission === 'granted' || motionPermission === 'unsupported';
                const orientationUsable = orientationPermission === 'granted' || orientationPermission === 'unsupported';

                if (!motionUsable && !orientationUsable) {
                    setMotionStatus('denied');
                    return false;
                }
            } catch {
                setMotionStatus('denied');
                return false;
            }

            const registered = registerMotionListeners();
            if (registered) removeMotionPermissionGestureHooks();
            return registered;
        })();

        try {
            return await motionPermissionRequest;
        } finally {
            motionPermissionRequest = null;
        }
    }

    function todayLabel() {
        return new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short' }).format(new Date());
    }

    function formatDuration(ms) {
        if (!Number.isFinite(ms) || ms < 0) return '00:00';
        const seconds = Math.floor(ms / 1000);
        const minutes = Math.floor(seconds / 60);
        return `${String(minutes).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function setScreen(title, artist, time, counter) {
        elements.trackTitle.textContent = title.toUpperCase();
        elements.trackArtist.textContent = artist;
        elements.trackTime.textContent = time;
        elements.trackCounter.textContent = counter;
        elements.trackTitle.classList.toggle('is-connect-prompt', title.toLowerCase() === 'connect to spotify');
    }

    function setControlsEnabled(enabled) {
        elements.previousButton.disabled = !enabled;
        elements.nextButton.disabled = !enabled;
        elements.playButton.disabled = !enabled;
        elements.stopButton.disabled = !enabled;
    }

    function setPlaying(nextIsPlaying) {
        isPlaying = nextIsPlaying;
        elements.platterDisc.classList.toggle('is-playing', isPlaying);
        elements.eqWave.classList.toggle('is-playing', isPlaying);
        elements.playIcon.className = isPlaying ? 'icon-pause' : 'icon-play';
        elements.playButton.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
    }

    function setConnected(connected) {
        elements.statusLight.classList.toggle('is-off', !connected);
        setControlsEnabled(connected);
        setConnectedLighting(connected);
    }

    function setConnectedLighting(connected) {
        elements.device.classList.toggle('is-connected', connected);
        elements.loginButton.classList.toggle('is-login-lit', !connected);
        [
            elements.previousButton,
            elements.nextButton,
            elements.playButton,
            elements.stopButton
        ].forEach((control) => control.classList.toggle('is-control-lit', connected));
        elements.volumeTick.classList.toggle('is-control-lit', connected);
    }

    function readTokenState() {
        return {
            accessToken: localStorage.getItem(STORAGE.accessToken),
            refreshToken: localStorage.getItem(STORAGE.refreshToken),
            expiresAt: Number(localStorage.getItem(STORAGE.expiresAt) || 0)
        };
    }

    function saveTokenState(tokenData) {
        localStorage.setItem(STORAGE.accessToken, tokenData.access_token);
        if (tokenData.refresh_token) {
            localStorage.setItem(STORAGE.refreshToken, tokenData.refresh_token);
        }
        localStorage.setItem(STORAGE.expiresAt, String(Date.now() + (tokenData.expires_in * 1000) - 60000));
    }

    function clearTokenState() {
        Object.values(STORAGE).forEach((key) => localStorage.removeItem(key));
    }

    function randomString(length) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        const values = crypto.getRandomValues(new Uint8Array(length));
        return Array.from(values, (value) => chars[value % chars.length]).join('');
    }

    async function sha256(value) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
    }

    function base64UrlEncode(buffer) {
        return btoa(String.fromCharCode(...new Uint8Array(buffer)))
            .replace(/\+/g, '-')
            .replace(/\//g, '_')
            .replace(/=+$/, '');
    }

    async function loginWithSpotify() {
        const codeVerifier = randomString(96);
        const state = randomString(32);
        const codeChallenge = base64UrlEncode(await sha256(codeVerifier));

        localStorage.setItem(STORAGE.verifier, codeVerifier);
        localStorage.setItem(STORAGE.state, state);

        const params = new URLSearchParams({
            response_type: 'code',
            client_id: SPOTIFY_CLIENT_ID,
            scope: SPOTIFY_SCOPES,
            code_challenge_method: 'S256',
            code_challenge: codeChallenge,
            redirect_uri: SPOTIFY_REDIRECT_URI,
            state
        });

        window.location.href = `https://accounts.spotify.com/authorize?${params}`;
    }

    async function exchangeCodeForToken(code) {
        const codeVerifier = localStorage.getItem(STORAGE.verifier);
        const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                grant_type: 'authorization_code',
                code,
                redirect_uri: SPOTIFY_REDIRECT_URI,
                client_id: SPOTIFY_CLIENT_ID,
                code_verifier: codeVerifier
            })
        });

        if (!response.ok) throw new Error('Spotify token exchange failed');
        const tokenData = await response.json();
        saveTokenState(tokenData);
        localStorage.removeItem(STORAGE.verifier);
        localStorage.removeItem(STORAGE.state);
    }

    async function refreshAccessToken() {
        const { refreshToken } = readTokenState();
        if (!refreshToken) throw new Error('Missing Spotify refresh token');

        const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                grant_type: 'refresh_token',
                refresh_token: refreshToken,
                client_id: SPOTIFY_CLIENT_ID
            })
        });

        if (!response.ok) throw new Error('Spotify token refresh failed');
        const tokenData = await response.json();
        saveTokenState(tokenData);
        return tokenData.access_token;
    }

    async function ensureAccessToken() {
        const tokenState = readTokenState();
        if (!tokenState.accessToken) return null;
        if (Date.now() < tokenState.expiresAt) return tokenState.accessToken;
        return refreshAccessToken();
    }

    async function spotifyFetch(path, options = {}, retry = true) {
        const accessToken = await ensureAccessToken();
        if (!accessToken) throw new Error('Spotify login required');

        const response = await fetch(`https://api.spotify.com${path}`, {
            ...options,
            headers: {
                Authorization: `Bearer ${accessToken}`,
                ...(options.headers || {})
            }
        });

        if (response.status === 401 && retry) {
            await refreshAccessToken();
            return spotifyFetch(path, options, false);
        }

        return response;
    }

    async function transferPlayback() {
        if (!deviceId) return;
        await spotifyFetch('/v1/me/player', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ device_ids: [deviceId], play: false })
        });
    }

    function updateFromPlayerState(state) {
        if (!state) return;
        const track = state.track_window.current_track;
        const artists = track.artists.map((artist) => artist.name).join(', ');
        setScreen(track.name, artists, formatDuration(state.duration), '1/1');
        setPlaying(!state.paused);
    }

    async function refreshPlaybackState() {
        const response = await spotifyFetch('/v1/me/player');
        if (response.status === 204) {
            setScreen('READY', 'Choose music in Spotify, then press play', '00:00', '0/0');
            setPlaying(false);
            return;
        }

        if (!response.ok) return;
        const playback = await response.json();
        if (!playback || !playback.item) return;

        const artists = playback.item.artists.map((artist) => artist.name).join(', ');
        setScreen(playback.item.name, artists, formatDuration(playback.item.duration_ms), '1/1');
        setPlaying(Boolean(playback.is_playing));
    }

    function waitForSpotifySDK() {
        if (window.Spotify) return Promise.resolve();
        return new Promise((resolve) => {
            window.onSpotifyWebPlaybackSDKReady = resolve;
            if (!document.querySelector('script[src="https://sdk.scdn.co/spotify-player.js"]')) {
                const sdkScript = document.createElement('script');
                sdkScript.src = 'https://sdk.scdn.co/spotify-player.js';
                sdkScript.async = true;
                document.body.appendChild(sdkScript);
            }
        });
    }

    async function bootSpotifyPlayer() {
        await waitForSpotifySDK();

        spotifyPlayer = new Spotify.Player({
            name: 'REKORD Hardware Player',
            getOAuthToken: async (callback) => callback(await ensureAccessToken()),
            volume: currentVolume
        });

        spotifyPlayer.addListener('ready', async ({ device_id }) => {
            deviceId = device_id;
            playerReady = true;
            setConnected(true);
            setScreen('SPOTIFY READY', 'Use the same controls', '00:00', '0/0');
            await transferPlayback();
            await refreshPlaybackState();
        });

        spotifyPlayer.addListener('not_ready', () => {
            playerReady = false;
            setConnected(false);
        });

        spotifyPlayer.addListener('player_state_changed', updateFromPlayerState);

        spotifyPlayer.addListener('initialization_error', ({ message }) => showSpotifyError(message));
        spotifyPlayer.addListener('authentication_error', ({ message }) => showSpotifyError(message));
        spotifyPlayer.addListener('account_error', ({ message }) => showSpotifyError(message));
        spotifyPlayer.addListener('playback_error', ({ message }) => showSpotifyError(message));

        spotifyPlayer.connect();
        clearInterval(pollingTimer);
        pollingTimer = setInterval(() => {
            if (playerReady) refreshPlaybackState().catch(() => {});
        }, 5000);
    }

    function showSpotifyError(message) {
        setConnected(false);
        setScreen('SPOTIFY ERROR', message || 'Check account and redirect URI', '00:00', 'ERR');
    }

    async function togglePlayback() {
        if (!playerReady || !spotifyPlayer) return;
        triggerHaptic(18, { intensity: 0.55 });
        await spotifyPlayer.togglePlay();
        await refreshPlaybackState();
    }

    async function pausePlayback() {
        if (!playerReady || !spotifyPlayer) return;
        triggerHaptic(18, { intensity: 0.45 });
        await spotifyPlayer.pause();
        await refreshPlaybackState();
    }

    async function previousTrack() {
        if (!playerReady) return;
        triggerHaptic('nudge');
        await spotifyFetch('/v1/me/player/previous', { method: 'POST' });
        setTimeout(refreshPlaybackState, 500);
    }

    async function nextTrack() {
        if (!playerReady) return;
        triggerHaptic('nudge');
        await spotifyFetch('/v1/me/player/next', { method: 'POST' });
        setTimeout(refreshPlaybackState, 500);
    }

    function volumeToDegrees(volume) {
        return -135 + volume * 270;
    }

    function applyVolumeRotation(volume) {
        elements.volumeKnob.style.setProperty('--knob-rotation', `${volumeToDegrees(volume).toFixed(3)}deg`);
    }

    function renderVolumeFrame() {
        const delta = targetVolume - displayedVolume;
        if (Math.abs(delta) < 0.001) {
            displayedVolume = targetVolume;
            applyVolumeRotation(displayedVolume);
            volumeAnimationFrame = null;
            return;
        }

        displayedVolume += delta * 0.28;
        applyVolumeRotation(displayedVolume);
        volumeAnimationFrame = requestAnimationFrame(renderVolumeFrame);
    }

    function scheduleVolumeRender(immediate = false) {
        if (immediate) {
            displayedVolume = targetVolume;
            applyVolumeRotation(displayedVolume);
            return;
        }

        if (!volumeAnimationFrame) {
            volumeAnimationFrame = requestAnimationFrame(renderVolumeFrame);
        }
    }

    async function commitSpotifyVolume(force = false) {
        if (!spotifyPlayer || pendingSpotifyVolume === null) return;

        const now = Date.now();
        const wait = Math.max(0, 90 - (now - lastSpotifyVolumeCommit));
        if (!force && wait > 0) {
            clearTimeout(volumeCommitTimer);
            volumeCommitTimer = setTimeout(() => commitSpotifyVolume(true), wait);
            return;
        }

        const volumeToCommit = pendingSpotifyVolume;
        pendingSpotifyVolume = null;
        lastSpotifyVolumeCommit = now;
        await spotifyPlayer.setVolume(volumeToCommit);
    }

    function setVolumeTarget(nextVolume, options = {}) {
        targetVolume = Math.max(0, Math.min(1, nextVolume));
        currentVolume = targetVolume;
        pendingSpotifyVolume = targetVolume;
        scheduleVolumeRender(Boolean(options.immediate));
        commitSpotifyVolume(Boolean(options.force)).catch(showSpotifyError);
    }

    async function updateVolume(nextVolume) {
        setVolumeTarget(nextVolume, { immediate: true, force: true });
    }

    function updateVolumeFromPointer(event) {
        if (activeVolumePointer !== null && event.pointerId !== activeVolumePointer) return;
        const coalescedEvents = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
        const pointerEvent = coalescedEvents.length ? coalescedEvents[coalescedEvents.length - 1] : event;
        const rect = elements.volumeKnob.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = pointerEvent.clientX - centerX;
        const dy = pointerEvent.clientY - centerY;
        let degrees = Math.atan2(dy, dx) * 180 / Math.PI + 90;

        if (degrees > 180) degrees -= 360;
        const clampedDegrees = Math.max(-135, Math.min(135, degrees));
        setVolumeTarget((clampedDegrees + 135) / 270);

        const volumeStep = Math.round(currentVolume * 20);
        if (volumeStep !== lastVolumeHapticStep) {
            lastVolumeHapticStep = volumeStep;
            triggerHaptic(8, { intensity: 0.25 });
        }
    }

    function endVolumeDrag() {
        elements.volumeKnob.classList.remove('is-dragging');
        if (activeVolumePointer !== null && elements.volumeKnob.hasPointerCapture(activeVolumePointer)) {
            elements.volumeKnob.releasePointerCapture(activeVolumePointer);
        }
        activeVolumePointer = null;
        commitSpotifyVolume(true).catch(showSpotifyError);
        document.removeEventListener('pointermove', updateVolumeFromPointer);
        document.removeEventListener('pointerup', endVolumeDrag);
        document.removeEventListener('pointercancel', endVolumeDrag);
    }

    function startVolumeDrag(event) {
        event.preventDefault();
        activeVolumePointer = event.pointerId;
        elements.volumeKnob.setPointerCapture(activeVolumePointer);
        elements.volumeKnob.classList.add('is-dragging');
        triggerHaptic(18, { intensity: 0.45 });
        updateVolumeFromPointer(event);
        document.addEventListener('pointermove', updateVolumeFromPointer);
        document.addEventListener('pointerup', endVolumeDrag);
        document.addEventListener('pointercancel', endVolumeDrag);
    }

    async function handleAuthCallback() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const storedState = localStorage.getItem(STORAGE.state);

        if (!code) return;
        if (!state || state !== storedState) throw new Error('Spotify auth state mismatch');

        await exchangeCodeForToken(code);
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    function bindControls() {
        const enableMotionFromGesture = () => {
            requestMotionPermission({ fromGesture: true });
        };
        elements.device.addEventListener('pointerdown', enableMotionFromGesture);
        elements.device.addEventListener('click', enableMotionFromGesture);
        elements.device.addEventListener('touchend', enableMotionFromGesture);
        elements.loginButton.addEventListener('click', async () => {
            triggerHaptic('success');
            requestMotionPermission({ fromGesture: true });
            if (readTokenState().accessToken) {
                clearTokenState();
                window.location.href = SPOTIFY_REDIRECT_URI;
                return;
            }
            await loginWithSpotify();
        });
        elements.playButton.addEventListener('click', () => togglePlayback().catch(showSpotifyError));
        elements.stopButton.addEventListener('click', () => pausePlayback().catch(showSpotifyError));
        elements.previousButton.addEventListener('click', () => previousTrack().catch(showSpotifyError));
        elements.nextButton.addEventListener('click', () => nextTrack().catch(showSpotifyError));
        elements.volumeKnob.addEventListener('pointerdown', startVolumeDrag);
        elements.volumeKnob.addEventListener('wheel', (event) => {
            event.preventDefault();
            triggerHaptic(8, { intensity: 0.25 });
            setVolumeTarget(currentVolume + (event.deltaY < 0 ? 0.035 : -0.035));
        });
    }

    async function init() {
        setupHaptics();
        setCableVisibility(SHOW_EARPHONE_CABLE);
        if (SHOW_EARPHONE_CABLE) {
            drawCablePath();
            requestMotionPermission();
        }
        elements.metaDate.textContent = todayLabel();
        setConnected(false);
        await updateVolume(currentVolume);
        bindControls();

        try {
            await handleAuthCallback();
            if (readTokenState().accessToken) {
                setScreen('LOADING SPOTIFY', 'Starting player', '00:00', '0/0');
                await bootSpotifyPlayer();
            } else {
                setScreen('Connect to Spotify', 'Press record to log in', '00:00', '0/0');
            }
        } catch (error) {
            showSpotifyError(error.message);
        }
    }

    init();
</script>

</body></html>
